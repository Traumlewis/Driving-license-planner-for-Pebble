function applyState(next,result){
 if(!next||!Array.isArray(next.entries)||next.revision<state.revision)return;
 if(state.fresh&&!next.fresh)return;
 var firstFresh=!state.fresh&&next.fresh;
 state=next;extras=state.extras||extras;
 var nextLang=Number(state.language||0);
 // Polling updates data, never rebuilds the form's option lists or overwrites a language preview.
 if(!languageDirty&&lang!==nextLang){lang=nextLang;$('language').value=lang;localize();}
 if(firstFresh&&!formDirty&&!editing&&!saving&&!$('form').contains(document.activeElement))reset();
 renderEntries();renderTimeline();
 var status=state.pending||state.error||t(state.fresh?'fresh':'offline');
 if(state.alarmOk===false)status+=' '+t('alarmError');if(state.storageOk===false)status+=' '+t('storageError');
 if($('status').textContent!==status)$('status').textContent=status;
 if(result&&result.rid&&saving){
  saving=false;
  if(result.status>=0){
   if(result.action==='language'){languageDirty=false;lang=nextLang;$('language').value=lang;localize();}
   if(result.action==='save'){editing=result.id||editing;editRevision=state.revision;formDirty=false;formTitles();}
   if(result.action==='delete')reset();
   renderTimeline();$('status').textContent=lang?'Saved on the watch.':'Auf der Uhr gespeichert.';
  }else $('error').textContent=state.error||t('needSync');
 }
 statusBadge();
}

function bridgeSnapshot(){
 if(!window.Pebble||typeof Pebble.sendMessage!=='function')return;
 Pebble.sendMessage('pkjs',{type:'snapshot'}).then(function(reply){if(reply&&reply.state)applyState(reply.state);}).catch(function(){});
}
function startBridge(){
 if(bridgeStarted)return;bridgeStarted=true;bridgeSnapshot();pollTimer=setInterval(bridgeSnapshot,5000);
}
if(window.Pebble&&typeof Pebble.sendMessage==='function'){
 Pebble.addEventListener('message',function(e){if(e.target==='pkjs'&&e.data&&e.data.type==='state')applyState(e.data.state,e.data.result);});
 Pebble.addEventListener('ready',function(e){if(e.target==='pkjs')startBridge();});
 if(typeof Pebble.readyTargets==='function'&&Pebble.readyTargets().indexOf('pkjs')!==-1)startBridge();
}

})();
