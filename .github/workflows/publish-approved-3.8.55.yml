name: Publish owner-approved 3.8.55

# One-time publication authorized by the owner on 2026-11-10.
# Normal source pushes do not run this workflow. This exact branch creation is
# the publication action; remove this workflow from main after publication.
on:
  create:

permissions:
  contents: read

concurrency:
  group: pebble-release-refs/heads/main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.ref_type == 'branch' && github.event.ref == 'publish-approved/v3.8.55'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and validate the exact tested PBW
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          assert json.loads(Path('release.json').read_text())['version']=='3.8.55'
          target=Path('release/Fahrschul-Planer-v3.8.55.pbw')
          parts=sorted(Path('.release-input/3.8.55').glob('pbw-*.b64'))
          if parts:
              assert [p.name for p in parts]==[f'pbw-{i:02d}.b64' for i in range(10)]
              target.write_bytes(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          assert digest=='a42d6790c7f9e715c3d739d8e4dc853e4db8a4bb822ed0b73f64c86b7fa4bea9'
          assert Path(str(target)+'.sha256').read_text()==digest+'  '+target.name+'\n'
          print('Verified exact tested PBW:',digest)
          PY
          python3 tests/release_validation.py
      - name: Save the regular release artifact and remove upload parts
        env:
          RELEASE_BRANCH: ${{ github.event.ref }}
        run: |
          if test -d .release-input/3.8.55; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -r .release-input/3.8.55
            git add release/Fahrschul-Planer-v3.8.55.pbw
            git commit -m 'Finalize verified 3.8.55 release PBW'
            git push --atomic origin HEAD:refs/heads/main "HEAD:refs/heads/${RELEASE_BRANCH}"
          fi
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Package and publish the approved release
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$RELEASE_TARGET" bash tools/publish_release.sh
